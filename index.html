<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stashfinder</title>
  <meta name="description" content="Ranks mountain snow stations so skiers, snowboarders, snowshoers and snowmobilers can see where the best backcountry snow is.">
  <!-- Beta: keep search engines from listing the site. Remove this line to go public. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1E4E79">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stashfinder">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:16px">Stashfinder needs JavaScript turned on.</p></noscript>
  <!-- Anonymous visit counts (GoatCounter: no cookies, no personal data). app.js counts each
       screen itself, because the app changes screens without reloading the page. -->
  <script>window.goatcounter = { no_onload: true };</script>
  <script id="goatcounter" data-goatcounter="https://snowscout.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
