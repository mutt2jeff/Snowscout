# Publishes SnowScout to GitHub Pages, with fresh British Columbia snow data.
#
# Runs when you upload changes, about every 30 minutes (to refresh BC readings), and
# when you press "Run workflow" on the Actions tab. Free for public repositories.
#
# One-time setup: repository Settings > Pages > Build and deployment > Source:
# "GitHub Actions".
#
# Note: GitHub pauses scheduled runs in repositories with no activity for 60 days.
# If BC data stops updating, open the Actions tab and re-enable this workflow.

name: Publish SnowScout

on:
  push:
    branches: [main]
  schedule:
    - cron: '20,50 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download BC snow data
        run: node scripts/build-bc-data.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
