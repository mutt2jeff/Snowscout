# Publishes SnowScout to GitHub Pages, with fresh British Columbia snow data.
#
# Runs when you upload changes, about every 30 minutes (to refresh BC readings), and
# when you press "Run workflow" on the Actions tab. Free for public repositories.
#
# One-time setup: repository Settings > Pages > Build and deployment > Source:
# "GitHub Actions".
#
# Note: GitHub pauses scheduled runs in repositories with no activity for 60 days.
# If BC data stops updating, open the Actions tab and re-enable this workflow.
#
# Build and deploy are separate jobs on purpose: when deploy-pages runs right after the
# upload in the same job it sometimes can't find the upload yet (actions/deploy-pages#451),
# and a re-run of a one-job layout can never recover. With two jobs, a failed deploy can
# be re-run on its own ("Re-run failed jobs").

name: Publish SnowScout

on:
  push:
    branches: [main]
  schedule:
    - cron: '20,50 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download BC snow data
        run: node scripts/build-bc-data.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
