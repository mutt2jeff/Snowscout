<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Build BC data (local)</title>
  <style>body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; } .fail { color: #B3261E; } .pass { color: #1B5E20; }</style>
</head>
<body>
  <h1>Build BC data locally</h1>
  <p>For testing on this PC only (run <code>serve.ps1 -Dev</code>). Online, the GitHub Action builds these
     files with <code>scripts/build-bc-data.mjs</code> using the same code.</p>
  <div id="out">Working…</div>
  <script type="module">
    import { buildBcData } from '../js/bc.js';
    const out = document.getElementById('out');
    try {
      const get = async (k) => { const r = await fetch(`../_bc/${k}`); if (!r.ok) throw new Error(`${k}: ${r.status}`); return r.text(); };
      const [stations, depth, swe, temp] = await Promise.all(['stations', 'depth', 'swe', 'temp'].map(get));
      const now = Date.now();
      const { stationsFile, readingsFile } = buildBcData({ depth, swe, temp }, JSON.parse(stations), now);
      const put = async (name, obj) => {
        const body = JSON.stringify(obj);
        const r = await fetch(`../data/${name}`, { method: 'PUT', body });
        if (!r.ok) throw new Error(`save ${name}: ${r.status}`);
        return body.length;
      };
      const sSize = await put('bc-stations.json', stationsFile);
      const rSize = await put('bc-readings.json', readingsFile);
      window.bcBuild = {
        stations: stationsFile.stations.length,
        located: stationsFile.stations.filter((s) => s.lat != null).length,
        latest: new Date(readingsFile.latestReadingMs).toISOString(),
        stationsKB: Math.round(sSize / 1024), readingsKB: Math.round(rSize / 1024),
      };
      out.className = 'pass';
      out.textContent = `Built: ${JSON.stringify(window.bcBuild)}`;
    } catch (e) {
      out.className = 'fail';
      out.textContent = `Failed: ${e.message}`;
      window.bcBuild = { error: e.message };
    }
  </script>
</body>
</html>
